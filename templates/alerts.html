{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">⏰ Expiry Alerts</h2>
<div class="card p-3">
<table class="table table-hover mb-0">
    <tr><th>Name</th><th>Batch</th><th>Expiry Date</th><th>Days Left</th><th>Status</th></tr>
    {% for item, status, color, days_left in alerts %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.batch_number }}</td>
        <td>{{ item.expiry_date }}</td>
        <td>{{ days_left }}</td>
        <td><span class="badge bg-{{ color }}">{{ status }}</span></td>
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
