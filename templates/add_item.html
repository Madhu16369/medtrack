{% extends "base.html" %}
{% block content %}
<h2>Add Inventory Item</h2>
<form method="POST">
    <div class="mb-3"><label>Item Name</label>
      <input type="text" name="name" class="form-control" required></div>
    <div class="mb-3"><label>Batch Number</label>
      <input type="text" name="batch_number" class="form-control" required></div>
    <div class="mb-3"><label>Quantity</label>
      <input type="number" name="quantity" class="form-control" required></div>
    <div class="mb-3"><label>Expiry Date</label>
      <input type="date" name="expiry_date" class="form-control" required></div>
    <div class="mb-3"><label>Supplier</label>
      <input type="text" name="supplier" class="form-control"></div>
    <div class="mb-3"><label>Storage Location</label>
      <input type="text" name="storage_location" class="form-control"></div>
    <div class="mb-3"><label>Department</label>
      <input type="text" name="department" class="form-control"></div>
    <div class="mb-3"><label>Unit Price</label>
      <input type="number" step="0.01" name="unit_price" class="form-control"></div>
    <div class="mb-3"><label>Minimum Stock Threshold</label>
      <input type="number" name="min_stock_threshold" class="form-control" value="10"></div>
    <button type="submit" class="btn btn-primary">Save Item</button>
</form>
{% endblock %}
