{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">🗑 Disposal History</h2>
<div class="card p-3">
<table class="table table-hover mb-0">
    <tr><th>Name</th><th>Batch</th><th>Qty</th><th>Expiry Date</th><th>Department</th><th>Removed On</th></tr>
    {% for r in removed %}
    <tr>
        <td>{{ r.name }}</td><td>{{ r.batch_number }}</td><td>{{ r.quantity }}</td>
        <td>{{ r.expiry_date }}</td><td>{{ r.department }}</td>
        <td>{{ r.removed_at.strftime('%Y-%m-%d') }}</td>
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
